<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>html, body { margin: 0; background: #fff } #stage { display: inline-block; padding: 16px; background: #fff }</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  // The toolchain's render page: Mermaid plus the semantic engine, driven from Node through Playwright.
  import mermaid from '/mermaid/mermaid.esm.min.mjs';
  import elkLayouts from '/vendor/layout-elk/mermaid-layout-elk.esm.mjs';
  import { install } from '/src/index.js';

  // plain ELK is registered too, so the toolchain can draw a baseline for comparison
  mermaid.registerLayoutLoaders(elkLayouts);
  // the ELK baseline renders around the wrapper, which would select the semantic layout
  const plainRender = mermaid.render.bind(mermaid);
  // flowcharts get the semantic layout the way an app gets it; other diagram types keep Mermaid's own
  const semantic = install(mermaid, { apply: 'flowcharts' });
  const stage = document.getElementById('stage');
  let counter = 0;

  /**
   * Render one diagram into the stage.
   * @param {string} source Mermaid or Semantic Mermaid text
   * @param {{ layout?: 'semantic' | 'elk', colors?: boolean, candidate?: string, fit?: number | false }} options
   */
  window.renderDiagram = async (source, options = {}) => {
    const layout = options.layout ?? 'semantic';
    // the ELK baseline applies to flowcharts only, as the semantic layout does
    let flowchart = false;
    try { flowchart = mermaid.detectType(source).startsWith('flowchart'); } catch { /* Mermaid's render reports it */ }
    // a fixed seed for the rough.js outlines Mermaid draws for some shapes, so the same source always
    // gives the same SVG (the layout itself has no randomness)
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default', handDrawnSeed: 1, ...(layout === 'elk' && flowchart ? { layout: 'elk' } : {}) });
    semantic.configure({ colors: options.colors !== false, candidate: options.candidate, pageWidth: options.fit || undefined });
    const id = `diagram-${counter++}`;
    const started = performance.now();
    const { svg } = await (layout === 'elk' ? plainRender : mermaid.render)(id, source);
    const ms = performance.now() - started;
    stage.innerHTML = svg;
    const element = stage.querySelector('svg');
    const box = element.viewBox.baseVal;
    // a diagram narrower than the page gets a frame as wide as the page, with the diagram in the middle
    if (options.fit && box.width < options.fit) {
      const pad = (options.fit - box.width) / 2;
      element.setAttribute('viewBox', `${box.x - pad} ${box.y} ${options.fit} ${box.height}`);
    }
    const frame = element.viewBox.baseVal;
    element.setAttribute('width', String(frame.width));
    element.setAttribute('height', String(frame.height));
    element.style.maxWidth = 'none';
    // XML, which an SVG file must be: Mermaid's labels hold HTML such as <br>, which the HTML serializer
    // leaves unclosed and image viewers (GitHub's included) then refuse to draw
    const xml = new XMLSerializer().serializeToString(element);
    return { svg: xml, report: layout === 'semantic' ? semantic.report(id) ?? null : null, width: frame.width, height: frame.height, ms };
  };
  window.semanticMermaidReady = true;
</script>
</body>
</html>
